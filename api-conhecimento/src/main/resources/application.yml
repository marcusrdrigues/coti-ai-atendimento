# api-conhecimento. Credenciais vêm de variáveis de ambiente (sem valor padrão = a subida falha, citando a variável).
server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: api-conhecimento
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null # campos opcionais ausentes são omitidos (contrato §1.3)
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${CONHECIMENTO_DB_URL}
    username: ${CONHECIMENTO_DB_USER} # papel da aplicação: só DML
    password: ${CONHECIMENTO_DB_PASSWORD}
    hikari:
      connection-timeout: 3000 # milissegundos; RNF04: PostgreSQL com tempo limite de 3 s
      # pgvector 0.8: o filtro e o limiar da busca são aplicados depois do scan do índice HNSW (ef_search = 40) e o
      # índice guarda linhas apagadas até o VACUUM; sem o scan iterativo a busca devolvia menos que o pedido, ou
      # nada (ScoreCossenoIT). strict_order mantém a ordem exata por distância.
      connection-init-sql: SET hnsw.iterative_scan = strict_order
  flyway:
    user: ${CONHECIMENTO_FLYWAY_USER} # papel dono do schema, usado só nas migrações
    password: ${CONHECIMENTO_FLYWAY_PASSWORD}
  ai:
    model:
      chat: none # este serviço só usa embeddings
    mcp:
      server:
        name: coti-conhecimento
        version: 1.0.0 # acompanha a versão do contrato (specs/06-api-contracts.md §4.1)
        protocol: STREAMABLE # o SSE está depreciado
        type: SYNC
        capabilities: # só a ferramenta de busca é publicada
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
    openai:
      api-key: ${OPENAI_API_KEY}
      timeout: ${OPENAI_TIMEOUT:30s}
      max-retries: 0 # novas tentativas ficam na aplicação, em um único ponto (ADR-13)
      embedding:
        # NONE: só o texto do trecho vira embedding. O padrão do modelo da OpenAI é EMBED, que acrescenta ao texto
        # os metadados do trecho (ids, status, datas) e polui o vetor. Achado pelo teste entre os dois serviços (T053).
        metadata-mode: NONE
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    vectorstore:
      pgvector:
        initialize-schema: false # o esquema vem das migrações Flyway, nunca da aplicação
        schema-validation: true # confere ao subir que a tabela existe
        remove-existing-vector-store-table: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536} # deve bater com vector(1536) da migração V3

coti:
  conhecimento:
    seguranca:
      admin-api-key: ${CONHECIMENTO_ADMIN_API_KEY}
      monitoramento-api-key: ${MONITORAMENTO_API_KEY}
      mcp-api-key: ${CONHECIMENTO_MCP_API_KEY} # chave de serviço da api-atendimentos para /mcp (Bearer)
    openai:
      api-key: ${OPENAI_API_KEY} # só validação de presença; o Spring AI lê spring.ai.openai.api-key
    web:
      limite-corpo-bytes: 262144 # 256 KB
    embedding:
      modelo: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small} # gravado em cada documento
    documentacao-publica: false
    divisao: # em caracteres (RF02); valores iniciais, ajustados pelo eval de recuperação
      tamanho-maximo: 1500
      sobreposicao: 200
      tamanho-minimo: 50
      maximo-trechos: 500
    embeddings: # RF03
      tamanho-lote: 100
      novas-tentativas: 2 # só para falha transitória (429, 5xx, tempo esgotado); o SDK fica com max-retries 0
      atraso-inicial: 200ms
      multiplicador: 2
      atraso-maximo: 2s
      jitter: 100ms
    busca: # RF04; o limiar é inicial e será confirmado pelo eval de recuperação
      pergunta-minima: 3
      pergunta-maxima: 1000
      limite-padrao: 5
      limite-maximo: 10
      limiar-similaridade: 0.70
      texto-maximo-por-trecho: 2000
      texto-maximo-total: 8000
      tempo-limite: 5s # inclui o embedding da pergunta (RNF04)
    analise:
      # Padrões de prompt injection (regex, sem diferenciar maiúsculas). Documento que casar fica EM_REVISAO.
      padroes-injecao:
        - 'ignor[ae]\s+(todas?\s+)?(as\s+)?(suas\s+|seus\s+)?(instru[cç][õo]es|regras|ordens)'
        - 'desconsider[ae]\s+.{0,40}(instru[cç][õo]es|regras)'
        - 'esque[cç]a\s+.{0,40}(instru[cç][õo]es|regras)'
        - 'n[ãa]o\s+(siga|obede[cç]a)\s+.{0,40}(instru[cç][õo]es|regras)'
        - 'voc[êe]\s+agora\s+[ée]\s+(um\s+|uma\s+|o\s+|a\s+)?(assistente|ia|rob[ôo]|bot|chatbot|modelo|sistema|dan|desenvolvedor|administrador|hacker)\b'
        - 'a\s+partir\s+de\s+agora\s*,?\s+voc[êe]\s+(deve|vai|precisa|responde|ignora|age|atua)\b'
        - 'revele\s+.{0,40}(prompt|instru[cç][õo]es)'
        - 'system\s*prompt|prompt\s+do\s+sistema'
        - 'ignore\s+(all\s+)?(the\s+)?(previous|prior|above)\s+(instructions|rules)'
        - 'disregard\s+.{0,40}(instructions|rules)'
        - 'you\s+are\s+now\s+(an?\s+)?(assistant|ai|bot|dan|developer|admin)\b'
        - '(?m)^\s*(system|assistant|user|developer)\s*:'
        - '</?\s*(trechos?|pergunta|system|assistant|instru[cç][aã]o)\b'
        - '\[/?(INST|SYS)\]|<\|[a-z_]+\|>'
      # E-mails (domínio) e telefones (somente dígitos) institucionais, que NÃO são dado pessoal.
      dominios-email-permitidos: []
      telefones-permitidos: []

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      roles: MONITORAMENTO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: api-conhecimento
