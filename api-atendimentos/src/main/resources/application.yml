# api-atendimentos. Credenciais vêm de variáveis de ambiente (sem valor padrão = a subida falha, citando a variável).
server:
  port: 8082
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: api-atendimentos
  autoconfigure:
    exclude:
      # A autenticação é por chave de API em filtros próprios. Sem esta exclusão o Spring cria um usuário em memória
      # e imprime a senha gerada no log da subida (credencial em log).
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  ai:
    mcp:
      client:
        name: coti-atendimentos
        version: 1.0.0
        type: SYNC
        # false: o cliente só se conecta na primeira chamada e se reconecta sozinho quando a api-conhecimento volta.
        # Com o padrão (true) a api-atendimentos NÃO sobe se a api-conhecimento estiver fora do ar (spike T044).
        initialized: false
        request-timeout: ${CONHECIMENTO_MCP_TIMEOUT:5s} # o padrão do Spring AI (20 s) é alto demais para atendimento
        toolcallback:
          enabled: false # o modelo não recebe a ferramenta: é o código que chama a busca (ADR-06)
        streamable-http:
          connections:
            conhecimento:
              url: ${CONHECIMENTO_MCP_URL}
              endpoint: /mcp
    chat:
      # Prompt e resposta carregam a pergunta do aluno e o texto dos trechos: nunca vão para log (AGENTS.md 4.4).
      # Os padrões já são false; ficam explícitos para que ligar um deles seja uma decisão visível em revisão.
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
      client:
        observations:
          log-prompt: false
          log-completion: false
    model:
      embedding: none # Artigo 6: embeddings só existem na api-conhecimento
    openai:
      api-key: ${OPENAI_API_KEY}
      timeout: ${OPENAI_TIMEOUT:20s}
      max-retries: 0 # novas tentativas ficam na aplicação, em um único ponto (ADR-13)
      chat:
        model: ${OPENAI_CHAT_MODEL} # identificador com versão, sem padrão (ADR-15)
        temperature: 0.0 # fidelidade ao trecho, sem criatividade
        max-tokens: 600 # teto de custo por resposta

coti:
  atendimentos:
    seguranca:
      monitoramento-api-key: ${MONITORAMENTO_API_KEY}
      mcp-api-key: ${CONHECIMENTO_MCP_API_KEY} # chave de serviço enviada à api-conhecimento (Bearer)
    openai:
      api-key: ${OPENAI_API_KEY} # só validação de presença; o Spring AI lê spring.ai.openai.api-key
      chat-model: ${OPENAI_CHAT_MODEL}
    conhecimento:
      url: ${CONHECIMENTO_MCP_URL} # só validação de presença; o cliente MCP lê spring.ai.mcp.client
    mensagens: # RF10: a resposta sem evidência é a mensagem seguida do canal humano, nunca texto do modelo
      sem-evidencia: ${ATENDIMENTO_MENSAGEM_SEM_EVIDENCIA}
      canal-humano: ${ATENDIMENTO_CANAL_HUMANO}
    web:
      limite-corpo-bytes: 262144 # 256 KB
    busca:
      limite: 5
      limiar-similaridade: 0.70 # igual ao do servidor; defesa em profundidade
    contexto: # contrato 6.3: o que o modelo recebe
      maximo-caracteres-trecho: 2000
      maximo-caracteres-total: 8000
      maximo-trechos: 5
    validacao:
      novas-tentativas-saida: 2 # saída reprovada volta ao modelo com o motivo
    prompt:
      versao: v1 # prompts/responder-pergunta.system.v1.st e user.v1.st
    limites-requisicao: # RF06: abuso e custo na rota pública; por IP da conexão e por instância
      perguntas-por-minuto-por-ip: 10
      maximo-de-ips: 10000
    resiliencia:
      mcp-tempo-limite: ${CONHECIMENTO_MCP_TIMEOUT:5s}
      mcp-novas-tentativas: 2 # falhas de transporte; a ferramenta é de leitura e idempotente
      prazo-total: 30s
      retry-after: 30s
      atraso-inicial: 200ms
      multiplicador: 2
      atraso-maximo: 2s
      jitter: 100ms
      saude-tempo-limite: 2s
      saude-validade: 10s # o health público não pode virar uma chamada ao MCP por requisição
      chat-tempo-limite: ${OPENAI_TIMEOUT:20s} # mesmo valor do timeout do cliente HTTP da OpenAI
      chat-novas-tentativas: 1 # timeout, 429 e 5xx; 400, 401 e 403 não repetem
    documentacao-publica: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      roles: MONITORAMENTO
      status:
        # DEGRADADO: a api-conhecimento está fora, mas o serviço responde (200). Fica abaixo de DOWN e acima de UP.
        order: DOWN,OUT_OF_SERVICE,DEGRADADO,UP,UNKNOWN
        http-mapping:
          DEGRADADO: 200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

logging:
  level:
    # Em DEBUG o SDK do MCP escreve as mensagens JSON-RPC inteiras: a pergunta do aluno e o texto dos trechos
    # (T061, LogsSemDadosSensiveisIT). Fixo em INFO para que subir o nível raiz para DEBUG não vaze esse conteúdo.
    io.modelcontextprotocol: INFO
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: api-atendimentos
